services:
  homeos:
    build: .
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - homeos-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  homeos-data:
